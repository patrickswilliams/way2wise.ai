<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Form Test</title>
</head>
<body>
  <h1>Netlify Form Test</h1>
  <form name="plain-test" method="POST" data-netlify="true">
    <input type="hidden" name="form-name" value="plain-test">
    <p><label>Message: <input type="text" name="message"></label></p>
    <p><button type="submit">Send</button></p>
  </form>
</body>
</html>
